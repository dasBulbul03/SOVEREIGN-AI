<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1560" viewBox="0 0 1800 1560">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#182433" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#40566f"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172b4d}.subtitle{font:15px Arial,sans-serif;fill:#60758a}
      .box{fill:#fff;stroke:#45698c;stroke-width:2;rx:10;filter:url(#shadow)}
      .head{fill:#e8f1fb;stroke:#45698c;stroke-width:2}.head-dark{fill:#dceafd;stroke:#45698c;stroke-width:2}
      .name{font:700 20px Arial,sans-serif;fill:#17365d}.stereo{font:italic 13px Arial,sans-serif;fill:#63758a}
      .item{font:16px Arial,sans-serif;fill:#34495e}.small{font:14px Arial,sans-serif;fill:#566b7f}.label{font:600 13px Arial,sans-serif;fill:#536a80}
      .edge{fill:none;stroke:#40566f;stroke-width:2.4;marker-end:url(#arrow)}.dependency{fill:none;stroke:#40566f;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#arrow)}
      .package{fill:#f5f8fc;stroke:#8ba2b8;stroke-width:2;stroke-dasharray:7 5;rx:12}.package-label{font:700 15px Arial,sans-serif;fill:#526a82}
      .divider{stroke:#a9bbcc;stroke-width:1}.glyph{fill:#fff;stroke:#45698c;stroke-width:1.7}
    </style>
  </defs>

  <rect width="1800" height="1560" fill="#f4f6f8"/>
  <text x="900" y="52" text-anchor="middle" class="title">Sovereign AI — Local Agentic Architecture</text>
  <text x="900" y="82" text-anchor="middle" class="subtitle">UML component and deployment flow · all inference, data, and artifacts remain local</text>

  <!-- Browser device -->
  <rect x="690" y="115" width="420" height="92" class="box"/>
  <text x="900" y="143" text-anchor="middle" class="stereo">«device»</text>
  <text x="900" y="176" text-anchor="middle" class="name">User Browser</text>

  <path d="M900 207 V255" class="edge"/>
  <text x="918" y="237" class="label">HTTPS / JSON</text>

  <!-- Workbench -->
  <rect x="650" y="258" width="500" height="118" class="box"/>
  <path d="M650 268 Q650 258 660 258 H1140 Q1150 258 1150 268 V305 H650 Z" class="head"/>
  <text x="675" y="290" class="stereo">«component»</text>
  <text x="900" y="338" text-anchor="middle" class="name">React / Next.js Workbench</text>
  <text x="900" y="361" text-anchor="middle" class="small">Workflow tabs · live status · results · approvals</text>
  <rect x="1108" y="273" width="23" height="14" class="glyph"/><rect x="1099" y="277" width="10" height="6" class="glyph"/><rect x="1099" y="286" width="10" height="6" class="glyph"/>

  <path d="M900 376 V428" class="edge"/>
  <text x="918" y="407" class="label">REST API</text>

  <!-- API -->
  <rect x="650" y="430" width="500" height="118" class="box"/>
  <path d="M650 440 Q650 430 660 430 H1140 Q1150 430 1150 440 V477 H650 Z" class="head-dark"/>
  <text x="675" y="462" class="stereo">«component»</text>
  <text x="900" y="510" text-anchor="middle" class="name">Fixed API Ingress → FastAPI Application API</text>
  <text x="900" y="533" text-anchor="middle" class="small">Allowlisted /api/v1 proxy · authentication · tenancy · task admission</text>
  <rect x="1108" y="445" width="23" height="14" class="glyph"/><rect x="1099" y="449" width="10" height="6" class="glyph"/><rect x="1099" y="458" width="10" height="6" class="glyph"/>

  <!-- Service package -->
  <path d="M140 625 V595 H335 L360 620 H1660 V970 H140 Z" class="package"/>
  <text x="164" y="617" class="package-label">APPLICATION SERVICES</text>

  <path d="M900 548 V585 H365 V660" class="dependency"/>
  <path d="M900 548 V660" class="dependency"/>
  <path d="M900 548 V585 H1435 V660" class="dependency"/>
  <text x="920" y="579" class="label">dispatches</text>

  <!-- Agent Runtime -->
  <rect x="190" y="660" width="350" height="250" class="box"/>
  <path d="M190 670 Q190 660 200 660 H530 Q540 660 540 670 V716 H190 Z" class="head"/>
  <text x="212" y="690" class="stereo">«component»</text><text x="365" y="746" text-anchor="middle" class="name">Agent Runtime</text>
  <line x1="190" y1="765" x2="540" y2="765" class="divider"/>
  <text x="225" y="800" class="item">Planner</text><text x="225" y="832" class="item">Router</text>
  <text x="225" y="864" class="item">Executor</text><text x="390" y="800" class="item">Policy</text>
  <text x="390" y="832" class="item">Queue worker</text><text x="390" y="864" class="item">Audit trace</text>
  <rect x="498" y="675" width="23" height="14" class="glyph"/><rect x="489" y="679" width="10" height="6" class="glyph"/><rect x="489" y="688" width="10" height="6" class="glyph"/>

  <!-- Knowledge Engine -->
  <rect x="725" y="660" width="350" height="250" class="box"/>
  <path d="M725 670 Q725 660 735 660 H1065 Q1075 660 1075 670 V716 H725 Z" class="head"/>
  <text x="747" y="690" class="stereo">«component»</text><text x="900" y="746" text-anchor="middle" class="name">Knowledge Engine</text>
  <line x1="725" y1="765" x2="1075" y2="765" class="divider"/>
  <text x="760" y="800" class="item">Document parser</text><text x="760" y="832" class="item">Chunker</text>
  <text x="760" y="864" class="item">Embeddings</text><text x="935" y="800" class="item">Retrieval</text>
  <text x="935" y="832" class="item">Ranking</text><text x="935" y="864" class="item">Citations</text>
  <rect x="1033" y="675" width="23" height="14" class="glyph"/><rect x="1024" y="679" width="10" height="6" class="glyph"/><rect x="1024" y="688" width="10" height="6" class="glyph"/>

  <!-- File Engine -->
  <rect x="1260" y="660" width="350" height="250" class="box"/>
  <path d="M1260 670 Q1260 660 1270 660 H1600 Q1610 660 1610 670 V716 H1260 Z" class="head"/>
  <text x="1282" y="690" class="stereo">«component»</text><text x="1435" y="746" text-anchor="middle" class="name">File Engine</text>
  <line x1="1260" y1="765" x2="1610" y2="765" class="divider"/>
  <text x="1295" y="800" class="item">Uploads</text><text x="1295" y="832" class="item">Artifacts</text>
  <text x="1295" y="864" class="item">Workspace</text><text x="1460" y="800" class="item">Validation</text>
  <text x="1460" y="832" class="item">Checksums</text><text x="1460" y="864" class="item">Isolation</text>
  <rect x="1568" y="675" width="23" height="14" class="glyph"/><rect x="1559" y="679" width="10" height="6" class="glyph"/><rect x="1559" y="688" width="10" height="6" class="glyph"/>

  <!-- Tool dependencies -->
  <path d="M365 910 V995 H900 V1035" class="dependency"/>
  <path d="M900 910 V1035" class="dependency"/>
  <path d="M1435 910 V995 H900 V1035" class="dependency"/>
  <text x="920" y="1018" class="label">uses governed tools</text>

  <!-- Tool layer -->
  <rect x="410" y="1040" width="980" height="190" class="box"/>
  <path d="M410 1050 Q410 1040 420 1040 H1380 Q1390 1040 1390 1050 V1090 H410 Z" class="head-dark"/>
  <text x="435" y="1073" class="stereo">«component»</text><text x="900" y="1074" text-anchor="middle" class="name">Governed Tool Layer</text>
  <rect x="455" y="1115" width="190" height="72" rx="7" fill="#f7faff" stroke="#91a9c0"/><text x="550" y="1145" text-anchor="middle" class="item">read_file</text><text x="550" y="1170" text-anchor="middle" class="item">search_docs</text>
  <rect x="675" y="1115" width="190" height="72" rx="7" fill="#f7faff" stroke="#91a9c0"/><text x="770" y="1145" text-anchor="middle" class="item">write_file</text><text x="770" y="1170" text-anchor="middle" class="item">python_exec</text>
  <rect x="895" y="1115" width="190" height="72" rx="7" fill="#f7faff" stroke="#91a9c0"/><text x="990" y="1145" text-anchor="middle" class="item">create_docx</text><text x="990" y="1170" text-anchor="middle" class="item">create_xlsx</text>
  <rect x="1115" y="1115" width="230" height="72" rx="7" fill="#f7faff" stroke="#91a9c0"/><text x="1230" y="1145" text-anchor="middle" class="item">create_pptx</text><text x="1230" y="1170" text-anchor="middle" class="small">bounded execution</text>
  <rect x="1348" y="1053" width="23" height="14" class="glyph"/><rect x="1339" y="1057" width="10" height="6" class="glyph"/><rect x="1339" y="1066" width="10" height="6" class="glyph"/>

  <!-- Infrastructure fan-out -->
  <path d="M900 1230 V1270 H310 V1320" class="dependency"/>
  <path d="M900 1230 V1320" class="dependency"/>
  <path d="M900 1230 V1270 H1290 V1320" class="dependency"/>
  <path d="M900 1230 V1270 H1600 V1320" class="dependency"/>

  <!-- LLM node -->
  <rect x="120" y="1320" width="380" height="180" class="box"/>
  <text x="310" y="1350" text-anchor="middle" class="stereo">«execution environment»</text>
  <text x="310" y="1382" text-anchor="middle" class="name">Local LLM Server</text>
  <line x1="120" y1="1400" x2="500" y2="1400" class="divider"/>
  <text x="155" y="1434" class="item">General / Vision</text><text x="155" y="1466" class="item">Coding</text><text x="340" y="1434" class="item">Embeddings</text><text x="340" y="1466" class="item">Ollama</text>

  <!-- PostgreSQL database -->
  <path d="M710 1340 C710 1312 1090 1312 1090 1340 V1478 C1090 1506 710 1506 710 1478 Z" fill="#fff" stroke="#45698c" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="900" cy="1340" rx="190" ry="28" fill="#e8f1fb" stroke="#45698c" stroke-width="2"/>
  <text x="900" y="1344" text-anchor="middle" class="stereo">«database»</text>
  <text x="900" y="1405" text-anchor="middle" class="name">PostgreSQL</text>
  <text x="900" y="1437" text-anchor="middle" class="item">Tasks · Runs · Queue</text>
  <text x="900" y="1467" text-anchor="middle" class="item">Registry · Audit metadata</text>

  <!-- Qdrant -->
  <path d="M1160 1340 C1160 1312 1420 1312 1420 1340 V1478 C1420 1506 1160 1506 1160 1478 Z" fill="#fff" stroke="#45698c" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="1290" cy="1340" rx="130" ry="28" fill="#e8f1fb" stroke="#45698c" stroke-width="2"/>
  <text x="1290" y="1344" text-anchor="middle" class="stereo">«vector database»</text>
  <text x="1290" y="1410" text-anchor="middle" class="name">Qdrant</text>
  <text x="1290" y="1445" text-anchor="middle" class="item">Vectors · Payloads</text>

  <!-- Filesystem -->
  <path d="M1475 1340 H1575 L1600 1318 H1720 V1500 H1475 Z" fill="#fff" stroke="#45698c" stroke-width="2" filter="url(#shadow)"/>
  <path d="M1475 1340 H1720" stroke="#45698c" stroke-width="2"/>
  <text x="1598" y="1375" text-anchor="middle" class="stereo">«local storage»</text>
  <text x="1598" y="1415" text-anchor="middle" class="name">Filesystem</text>
  <text x="1598" y="1450" text-anchor="middle" class="item">Uploads</text>
  <text x="1598" y="1480" text-anchor="middle" class="item">Artifacts</text>

  <text x="40" y="1535" class="small">Solid arrows: request flow · Dashed arrows: UML dependency / governed use</text>
</svg>
